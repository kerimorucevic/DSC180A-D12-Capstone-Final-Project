# Paths are relative to the repo root unless absolute. Memos and labels stay on DataHub (data/ and outputs/
# are git-ignored).
paths:
  data_dir: "~/teams/d12/UCSD - Data Share"     # Prism parquet files
  seed_labels: data/labels_seed.csv              # earlier reviewed labels; their accounts seed the next batch
  review_file: data/review_batch.csv             # suggested labels + review decisions
  labels: data/labels_v2.csv                     # reviewed labels the model trains on
  split_plan: data/split_plan.json               # frozen cutoffs + held-out accounts
  suggest_model: null                            # earlier fastText model for a second suggestion (optional)
  out_dir: outputs

data:
  parquet_glob: "ucsd_transactions_part_*.parquet"

seed: 0

split:
  val_start: "2026-04-01"           # train < val_start <= validation < test_start <= test
  test_start: "2026-06-01"
  heldout_account_share: 0.20       # accounts held out entirely for Test B

sampling:
  bucket_targets: {train: 585, val: 135, test_A: 90, test_B: 90}
  rare_target: 25                   # aim for at least this many labels per category

review:
  audit_fraction: 0.25
  audit_min: 30
  audit_max_error: 0.05

fasttext:
  thread: 1                         # repeatable runs
  bucket: 200000                    # default 2,000,000 makes a ~1.6 GB model with character n-grams
  defaults: {epoch: 25, lr: 0.1, dim: 100, minCount: 1, wordNgrams: 1, minn: 0, maxn: 0}
  seeds: [0, 1, 2]
  grid:
    text_col: [text_lower, text_norm]
    wordNgrams: [1, 2]
    char_ngrams: [[0, 0], [3, 5]]
    stage1_epoch: 50
    stage1_lr: 0.5
    epoch: [25, 50, 100]
    lr: [0.1, 0.5, 1.0]
